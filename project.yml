name: Execution
options:
  bundleIdPrefix: com.makemagic
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Execution:
    type: application
    platform: iOS
    sources: [Execution]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.makemagic.execution
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Execution
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  ExecutionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExecutionTests]
    dependencies:
      - target: Execution
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.makemagic.execution.tests
schemes:
  Execution:
    build:
      targets:
        Execution: all
    test:
      targets:
        - ExecutionTests
